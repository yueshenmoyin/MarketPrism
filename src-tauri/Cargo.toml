[package]
name = "aitrade-cn"
version = "0.1.0"
description = "MarketPrism AI stock research workspace"
authors = ["AITrade"]
edition = "2021"

[lib]
name = "aitrade_cn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
