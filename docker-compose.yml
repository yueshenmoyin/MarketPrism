services:
  aitrade:
    build: .
    env_file:
      - .env
    volumes:
      - aitrade_data:/home/appuser/.aitrade
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  aitrade-ollama:
    build: .
    env_file:
      - .env
    environment:
      - LLM_PROVIDER=ollama
    volumes:
      - aitrade_data:/home/appuser/.aitrade
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  aitrade_data:
  ollama_data:
